<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="student-details">
      <div>NAME: TANISHQ DODIYA</div>
      <div>PRN: 24070521021</div>
    </div>

    <div class="container">
      <h2>Registration Form</h2>
      <form id="registrationForm" novalidate>
        <div class="form-row">
          <label for="firstName">First name:<span class="required">*</span></label>
          <input type="text" id="firstName" name="firstName" required />
          <small class="error-message"></small>
        </div>

        <div class="form-row">
          <label for="lastName">Last name:<span class="required">*</span></label>
          <input type="text" id="lastName" name="lastName" required />
          <small class="error-message"></small>
        </div>

        <div class="form-row">
          <label for="birthday">Birthday:<span class="required">*</span></label>
          <input type="date" id="birthday" name="birthday" required />
          <small class="error-message"></small>
        </div>

        <div class="form-row">
          <label for="username">Username:<span class="required">*</span></label>
          <input type="text" id="username" name="username" required minlength="4" />
          <small class="error-message"></small>
        </div>

        <div class="form-row">
          <label for="email">Email:<span class="required">*</span></label>
          <input type="email" id="email" name="email" required />
          <small class="error-message"></small>
        </div>

        <div class="form-row">
          <label for="website">Website:<span class="required">*</span></label>
          <input type="url" id="website" name="website" required placeholder="https://example.com" />
          <small class="error-message"></small>
        </div>

        <div class="form-row">
          <label for="password">Password:<span class="required">*</span></label>
          <input type="password" id="password" name="password" required minlength="6" />
          <small class="error-message"></small>
        </div>

        <div class="form-row">
          <label for="repassword">Re-password:<span class="required">*</span></label>
          <input type="password" id="repassword" name="repassword" required />
          <small class="error-message"></small>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">I agree to the terms and conditions</label>
          <small class="error-message"></small>
        </div>

        <button type="submit">Submit</button>
        <p id="successMessage" class="success-message" aria-live="polite"></p>
      </form>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
